    <style id="theme-vars">
/* ===== 小确幸 App - iOS Style Design System ===== */
/* Warm, refined, plant-themed journaling app with iOS aesthetic */

:root {
  /* === Brand Primary: Soft Sage Green (iOS-refined) === */
  --qx-primary: #5E9B6A;
  --qx-primary-light: #7AB886;
  --qx-primary-lighter: #A8D5B0;
  --qx-primary-dark: #4A7D54;
  --qx-primary-50: #F0F7F1;
  --qx-primary-100: #DCEFDF;
  --qx-primary-200: #B9DFBF;
  --qx-primary-container: rgba(94, 155, 106, 0.08);
  --qx-primary-container-strong: rgba(94, 155, 106, 0.12);

  /* === Neutral Scale: Warm Gray === */
  --qx-gray-50: #FBFBF9;
  --qx-gray-100: #F5F4F2;
  --qx-gray-200: #EBE9E5;
  --qx-gray-300: #D8D6D1;
  --qx-gray-400: #B0ADA6;
  --qx-gray-500: #8A8780;
  --qx-gray-600: #6B6862;
  --qx-gray-700: #4A4844;
  --qx-gray-800: #2D2B29;
  --qx-gray-900: #1A1918;

  /* === Semantic Backgrounds === */
  --qx-background: #FBFBF9;
  --qx-background-elevated: #FFFFFF;
  --qx-background-grouped: #F2F1EE;
  --qx-surface: #FFFFFF;
  --qx-surface-secondary: #F7F6F4;
  --qx-surface-tertiary: #F0EFEB;

  /* === Text === */
  --qx-foreground: #1A1918;
  --qx-foreground-secondary: #6B6862;
  --qx-foreground-tertiary: #8A8780;
  --qx-foreground-quaternary: #B0ADA6;
  --qx-foreground-inverse: #FFFFFF;
  --qx-primary-foreground: #FFFFFF;

  /* === Borders & Dividers === */
  --qx-border-subtle: rgba(0,0,0,0.06);
  --qx-border-strong: rgba(0,0,0,0.1);
  --qx-separator: rgba(60,60,67,0.12);
  --qx-separator-opaque: #E5E4E0;

  /* === State Colors (iOS semantic) === */
  --state-success: #34C759;
  --state-warning: #FF9500;
  --state-error: #FF3B30;
  --state-info: #007AFF;

  /* === Mood/Accent Tones (muted, iOS-style) === */
  --mood-happy: #F5C842;
  --mood-warm: #F4A261;
  --mood-calm: #7EC8CE;
  --mood-love: #F48FB1;
  --mood-grateful: #CE93D8;
  --mood-excited: #FF7043;

  /* === Radius Scale (iOS 16+ style) === */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-2xl: 24px;
  --radius-full: 9999px;

  /* === Shadows (iOS-style, very soft) === */
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.03);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-xl: 0 16px 40px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-float: 0 2px 8px rgba(0,0,0,0.04), 0 0 1px rgba(0,0,0,0.02);

  /* === Spacing === */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-base: 16px;
  --spacing-lg: 20px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  --spacing-3xl: 48px;

  /* === Typography === */
  --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Noto Sans SC', sans-serif;
  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 15px;
  --font-size-md: 16px;
  --font-size-lg: 17px;
  --font-size-xl: 20px;
  --font-size-2xl: 22px;
  --font-size-3xl: 28px;
  --font-size-hero: 34px;

  /* === Prefixed semantic aliases === */
  --qx-background-alias: var(--qx-background);
  --qx-foreground-alias: var(--qx-foreground);
  --qx-card: var(--qx-surface);
  --qx-card-foreground: var(--qx-foreground);
  --qx-popover: var(--qx-surface);
  --qx-popover-foreground: var(--qx-foreground);
  --qx-muted: var(--qx-surface-secondary);
  --qx-muted-foreground: var(--qx-foreground-secondary);
  --qx-border: var(--qx-separator-opaque);
  --qx-input: var(--qx-gray-100);
  --qx-ring: var(--qx-primary);
  --qx-radius-sm: var(--radius-sm);
  --qx-radius-md: var(--radius-md);
  --qx-radius-lg: var(--radius-lg);
  --qx-radius-small: var(--radius-sm);
  --qx-radius-medium: var(--radius-md);
  --qx-radius-large: var(--radius-lg);

  /* === Non-prefixed semantic aliases for head-contract === */
  --color-background: var(--qx-background);
  --color-foreground: var(--qx-foreground);
  --color-card: var(--qx-surface);
  --color-card-foreground: var(--qx-foreground);
  --color-popover: var(--qx-surface);
  --color-popover-foreground: var(--qx-foreground);
  --color-primary: var(--qx-primary);
  --color-primary-foreground: var(--qx-primary-foreground);
  --color-muted: var(--qx-surface-secondary);
  --color-muted-foreground: var(--qx-foreground-secondary);
  --color-border: var(--qx-separator-opaque);
  --color-input: var(--qx-gray-100);
  --color-ring: var(--qx-primary);
  --background: var(--qx-background);
  --foreground: var(--qx-foreground);
  --radius-small: var(--radius-sm);
  --radius-medium: var(--radius-md);
  --radius-large: var(--radius-lg);
}

/* === Base Reset & Typography === */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html {
  font-size: 16px;
}

body {
  font-family: var(--font-family);
  font-size: var(--font-size-base);
  line-height: 1.47;
  color: var(--qx-foreground);
  background: var(--qx-background);
  letter-spacing: -0.01em;
}

/* === iOS-style Large Title === */
.ios-large-title {
  font-size: var(--font-size-hero);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
  color: var(--qx-foreground);
}

.ios-title-1 {
  font-size: var(--font-size-3xl);
  font-weight: 700;
  letter-spacing: -0.015em;
  line-height: 1.2;
}

.ios-title-2 {
  font-size: var(--font-size-2xl);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.25;
}

.ios-title-3 {
  font-size: var(--font-size-xl);
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.ios-headline {
  font-size: var(--font-size-lg);
  font-weight: 600;
  line-height: 1.3;
}

.ios-body {
  font-size: var(--font-size-base);
  font-weight: 400;
  line-height: 1.47;
}

.ios-callout {
  font-size: var(--font-size-md);
  font-weight: 400;
  line-height: 1.4;
}

.ios-subhead {
  font-size: var(--font-size-sm);
  font-weight: 400;
  line-height: 1.4;
  color: var(--qx-foreground-secondary);
}

.ios-footnote {
  font-size: var(--font-size-xs);
  font-weight: 400;
  line-height: 1.3;
  color: var(--qx-foreground-tertiary);
}

.ios-caption {
  font-size: 10px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--qx-foreground-tertiary);
}

/* === iOS-style Card === */
.ios-card {
  background: var(--qx-surface);
  border-radius: var(--radius-xl);
  border: 0.5px solid var(--qx-border-subtle);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.ios-card-inset {
  background: var(--qx-surface);
  border-radius: var(--radius-lg);
  border: 0.5px solid var(--qx-border-subtle);
}

.ios-card-glass {
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: var(--radius-xl);
  border: 0.5px solid rgba(255,255,255,0.6);
}

/* === iOS-style Button === */
.ios-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 24px;
  font-size: var(--font-size-lg);
  font-weight: 600;
  font-family: inherit;
  border: none;
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: -0.01em;
}

.ios-btn-primary {
  background: var(--qx-primary);
  color: white;
}

.ios-btn-primary:active {
  background: var(--qx-primary-dark);
  transform: scale(0.98);
}

.ios-btn-secondary {
  background: var(--qx-primary-container);
  color: var(--qx-primary);
}

.ios-btn-ghost {
  background: transparent;
  color: var(--qx-primary);
}

.ios-btn-large {
  width: 100%;
  padding: 16px;
  font-size: var(--font-size-lg);
  border-radius: var(--radius-lg);
}

/* === iOS-style Tab Bar (floating translucent) - canonical structure === */
nav[data-mobile-nav="global"] button {
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

nav[data-mobile-nav="global"] button svg {
  stroke: var(--qx-gray-400);
  transition: all 0.2s ease;
}

nav[data-mobile-nav="global"] button span {
  color: var(--qx-gray-400);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.2s ease;
}

nav[data-mobile-nav="global"] button.active svg {
  stroke: var(--qx-primary);
}

nav[data-mobile-nav="global"] button.active span {
  color: var(--qx-primary);
  font-weight: 600;
}

/* Center record button raised above the bar */
nav[data-mobile-nav="global"] button[data-nav-key="record"] {
  margin-top: -18px;
}

.record-btn {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--qx-primary), var(--qx-primary-dark, #4a8256));
  border-radius: 50%;
  box-shadow: 0 4px 16px rgba(94,155,106,0.35), 0 2px 6px rgba(94,155,106,0.2);
  transition: transform 0.2s ease;
}

.record-btn svg {
  stroke: white !important;
}

.record-btn:active {
  transform: scale(0.92);
}

/* === iOS-style Status Bar area === */
.ios-status-bar {
  height: env(safe-area-inset-top, 47px);
  min-height: 47px;
  width: 100%;
}

/* === iOS Navigation Large Title area === */
.ios-nav-large {
  padding: 0 20px;
  padding-bottom: 8px;
}

.ios-nav-large .ios-large-title {
  margin-bottom: 2px;
}

.ios-nav-subtitle {
  font-size: var(--font-size-base);
  color: var(--qx-foreground-secondary);
  font-weight: 400;
}

/* === iOS-style Grouped List === */
.ios-group {
  margin: 0 16px;
  margin-bottom: var(--spacing-lg);
}

.ios-group-header {
  padding: 0 16px;
  padding-bottom: 6px;
  font-size: var(--font-size-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--qx-foreground-tertiary);
}

.ios-group-card {
  background: var(--qx-surface);
  border-radius: var(--radius-xl);
  border: 0.5px solid var(--qx-border-subtle);
  overflow: hidden;
}

.ios-list-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  min-height: 48px;
}

.ios-list-row + .ios-list-row {
  border-top: 0.5px solid var(--qx-separator);
  margin-left: 52px;
}

.ios-list-row-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.ios-list-row-content {
  flex: 1;
  min-width: 0;
}

.ios-list-row-title {
  font-size: var(--font-size-base);
  font-weight: 400;
  color: var(--qx-foreground);
}

.ios-list-row-subtitle {
  font-size: var(--font-size-sm);
  color: var(--qx-foreground-secondary);
  margin-top: 1px;
}

.ios-list-row-value {
  font-size: var(--font-size-base);
  color: var(--qx-foreground-tertiary);
  flex-shrink: 0;
}

.ios-list-row-chevron {
  color: var(--qx-gray-300);
  flex-shrink: 0;
}

/* === Tag Chips (iOS-style) === */
.ios-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 7px 14px;
  font-size: var(--font-size-sm);
  font-weight: 500;
  font-family: inherit;
  border-radius: var(--radius-full);
  border: none;
  background: var(--qx-gray-100);
  color: var(--qx-foreground-secondary);
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.ios-chip.selected {
  background: var(--qx-primary);
  color: white;
}

.ios-chip.mood-happy.selected { background: var(--mood-happy); color: #5D4A00; }
.ios-chip.mood-warm.selected { background: var(--mood-warm); color: white; }
.ios-chip.mood-calm.selected { background: var(--mood-calm); color: #1B5E63; }
.ios-chip.mood-love.selected { background: var(--mood-love); color: white; }
.ios-chip.mood-grateful.selected { background: var(--mood-grateful); color: white; }

/* === Progress Bar (iOS-style) === */
.ios-progress {
  width: 100%;
  height: 6px;
  background: var(--qx-gray-200);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.ios-progress-fill {
  height: 100%;
  background: var(--qx-primary);
  border-radius: var(--radius-full);
  transition: width 0.5s ease;
}

/* === Page padding helper === */
.page-content {
  padding-bottom: 100px;
}

/* === Segmented Control (iOS-style) === */
.ios-segmented {
  display: flex;
  padding: 2px;
  background: var(--qx-gray-100);
  border-radius: var(--radius-md);
  gap: 2px;
}

.ios-segmented-item {
  flex: 1;
  padding: 7px 12px;
  font-size: var(--font-size-sm);
  font-weight: 500;
  font-family: inherit;
  text-align: center;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--qx-foreground-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
}

.ios-segmented-item.active {
  background: var(--qx-surface);
  color: var(--qx-foreground);
  font-weight: 600;
  box-shadow: var(--shadow-xs);
}

/* === Stat Pill === */
.ios-stat-pill {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 12px 8px;
  flex: 1;
}

.ios-stat-value {
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--qx-foreground);
  letter-spacing: -0.02em;
}

.ios-stat-label {
  font-size: var(--font-size-xs);
  color: var(--qx-foreground-tertiary);
  font-weight: 500;
}

/* === Record Card (iOS-style) === */
.ios-record-card {
  background: var(--qx-surface);
  border-radius: var(--radius-xl);
  border: 0.5px solid var(--qx-border-subtle);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

/* === Text Field (iOS-style) === */
.ios-input {
  width: 100%;
  padding: 14px 16px;
  font-size: var(--font-size-lg);
  font-family: inherit;
  border: none;
  border-radius: var(--radius-lg);
  background: var(--qx-surface-secondary);
  color: var(--qx-foreground);
  outline: none;
  transition: background 0.2s ease;
}

.ios-input::placeholder {
  color: var(--qx-foreground-quaternary);
}

.ios-input:focus {
  background: var(--qx-gray-100);
}

.ios-textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px 16px;
  font-size: var(--font-size-lg);
  font-family: inherit;
  border: none;
  border-radius: var(--radius-lg);
  background: var(--qx-surface-secondary);
  color: var(--qx-foreground);
  outline: none;
  resize: none;
  line-height: 1.5;
}

.ios-textarea::placeholder {
  color: var(--qx-foreground-quaternary);
}

/* === Avatar === */
.ios-avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--qx-primary-light), var(--qx-primary));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
}

.ios-avatar-sm {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

/* === Divider === */
.ios-divider {
  height: 0.5px;
  background: var(--qx-separator);
  margin: 0;
}

/* === Utility === */
.text-primary { color: var(--qx-primary); }
.text-secondary { color: var(--qx-foreground-secondary); }
.text-tertiary { color: var(--qx-foreground-tertiary); }
.text-center { text-align: center; }
.font-bold { font-weight: 700; }
.font-semibold { font-weight: 600; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.gap-xs { gap: 4px; }
.gap-sm { gap: 8px; }
.gap-md { gap: 12px; }
.gap-base { gap: 16px; }
.gap-lg { gap: 20px; }
.w-full { width: 100%; }

      line-height: 1.3;
    }

    .card-music-artist {
      font-size: 11px;
      color: var(--qx-gray-400);
      margin-top: 1px;
      line-height: 1.3;
    }

    .card-music-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
    }

    .card-music-bar {
      width: 3px;
      background: var(--qx-primary);
      border-radius: 2px;
      opacity: 0.5;
    }
    .card-music-bar:nth-child(1) { height: 6px; animation: musicbar 0.8s ease-in-out infinite alternate; animation-delay: 0s; }
    .card-music-bar:nth-child(2) { height: 12px; animation: musicbar 0.7s ease-in-out infinite alternate; animation-delay: 0.15s; }
    .card-music-bar:nth-child(3) { height: 8px; animation: musicbar 0.9s ease-in-out infinite alternate; animation-delay: 0.3s; }
    .card-music-bar:nth-child(4) { height: 14px; animation: musicbar 0.6s ease-in-out infinite alternate; animation-delay: 0.45s; }

    @keyframes musicbar {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1); }
    }

    /* Bottom bar */
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 0.5px solid var(--qx-border-subtle);
    }

    .card-bottom-left {
      font-size: 20px;
    }

    .card-bottom-center {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: var(--qx-gray-400);
      font-weight: 500;
      letter-spacing: 0.03em;
    }

    .card-bottom-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .card-qr {
      width: 48px;
      height: 48px;
      background:
        repeating-conic-gradient(var(--qx-gray-800) 0% 25%, white 0% 50%) 0 0 / 8px 8px,
        white;
      border-radius: 6px;
      border: 1.5px solid var(--qx-gray-200);
      position: relative;
      overflow: hidden;
    }

    .card-qr-label {
      font-size: 9px;
      color: var(--qx-gray-400);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* === iOS Share Sheet === */
    .share-sheet {
      background: rgba(40, 40, 40, 0.82);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border-radius: 16px 16px 0 0;
      padding: 12px 0 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      margin: 0 8px;
      margin-bottom: 8px;
      position: relative;
      /* Sheet entrance */
      animation: slideUp 0.4s cubic-bezier(0.32, 0.72, 0, 1) both;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .share-sheet-grabber {
      width: 36px;
      height: 5px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      margin: 0 auto 16px;
    }

    /* App icon row */
    .app-icon-row {
      display: flex;
      gap: 4px;
      padding: 0 8px 18px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .app-icon-row::-webkit-scrollbar { display: none; }

    .app-icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 72px;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .app-icon-item:active {
      transform: scale(0.92);
    }

    .app-icon-circle {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .app-icon-circle svg {
      width: 28px;
      height: 28px;
    }

    .app-icon-circle.wechat {
      background: linear-gradient(135deg, #07C160, #06AD56);
    }
    .app-icon-circle.moments {
      background: linear-gradient(135deg, #07C160, #06AD56);
    }
    .app-icon-circle.weibo {
      background: linear-gradient(135deg, #FF8200, #E65100);
    }
    .app-icon-circle.xiaohongshu {
      background: linear-gradient(135deg, #FF2442, #E01E37);
    }
    .app-icon-circle.save {
      background: rgba(255,255,255,0.12);
    }
    .app-icon-circle.copy {
      background: rgba(255,255,255,0.12);
    }

    .app-icon-label {
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      font-weight: 400;
      text-align: center;
      line-height: 1.2;
    }

    /* Action buttons */
    .action-section {
      margin: 0 12px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .action-row:active {
      background: rgba(255,255,255,0.08);
    }
    .action-row + .action-row {
      border-top: 0.5px solid rgba(255,255,255,0.08);
    }

    .action-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .action-icon svg {
      width: 20px;
      height: 20px;
      stroke: rgba(255,255,255,0.6);
    }

    .action-label {
      flex: 1;
      font-size: 17px;
      color: #FFFFFF;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .action-chevron {
      color: rgba(255,255,255,0.3);
      flex-shrink: 0;
    }
    .action-chevron svg {
      width: 18px;
      height: 18px;
    }

    /* Cancel button */
    .cancel-btn-wrap {
      margin: 4px 12px 0;
    }

    .cancel-btn {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      font-family: inherit;
      color: #FFFFFF;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: -0.01em;
    }
    .cancel-btn:active {
      background: rgba(255,255,255,0.2);
      transform: scale(0.98);
    }

    /* Bottom safe spacing */
    .bottom-safe {
      height: env(safe-area-inset-bottom, 0px);
    }

    /* === WeChat Icon (simplified) === */
    .wechat-icon {
      position: relative;
    }
    .wechat-icon::before {
      content: '';
      position: absolute;
      width: 22px;
      height: 16px;
      background: white;
      border-radius: 10px 10px 10px 4px;
      top: 2px;
      left: 3px;
    }
    .wechat-icon::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 12px;
      background: white;
      border-radius: 8px 8px 4px 8px;
      bottom: 0;
      right: 3px;
    }
    .wechat-dot1 {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #07C160;
      border-radius: 50%;
      top: 6px;
      left: 9px;
      z-index: 1;
    }
    .wechat-dot2 {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #07C160;
      border-radius: 50%;
      top: 6px;
      left: 18px;
      z-index: 1;
    }
    .wechat-dot3 {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #07C160;
      border-radius: 50%;
      bottom: 4px;
      right: 8px;
      z-index: 1;
    }
    .wechat-dot4 {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #07C160;
      border-radius: 50%;
      bottom: 4px;
      right: 15px;
      z-index: 1;
    }
  </style>
</body>
</html>
