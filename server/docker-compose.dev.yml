services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xqx
      POSTGRES_PASSWORD: xqx
      POSTGRES_DB: xiaoquexing
    ports:
      - "5432:5432"
    volumes:
      - xqx_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xqx -d xiaoquexing"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: xiaoquexing/xqx-api:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://xqx:xqx@postgres:5432/xiaoquexing?sslmode=disable
      MIGRATIONS_PATH: file:///app/migrations
    entrypoint: ["/usr/local/bin/xqx-migrate", "up"]

  api:
    image: xiaoquexing/xqx-api:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: dev
      HTTP_ADDR: :8080
      POSTGRES_DSN: postgres://xqx:xqx@postgres:5432/xiaoquexing?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_KEY_PREFIX: xqx:dev:
      JWT_SIGNING_KEY: dev-only-change-me-32bytes-secret!!
      PHONE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PHONE_HASH_PEPPER: dev-only-phone-pepper
      SMS_PROVIDER: mock
      SMS_DEV_CODE: 123456
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/xqx-api"]
      disable: true

volumes:
  xqx_pg:
