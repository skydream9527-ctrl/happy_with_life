# 一台阿里云 ECS 的起步部署：PostgreSQL + Redis + API + Nginx。
# 在仓库根目录：
#   cp deploy/env.ecs.example .env
#   docker compose -f deploy/compose/docker-compose.all-in-one.yml --env-file .env up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xqx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xiaoquexing
    volumes:
      - xqx_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xqx -d xiaoquexing"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - xqx_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: xiaoquexing/xqx-api:${IMAGE_TAG:-local}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://xqx:${POSTGRES_PASSWORD}@postgres:5432/xiaoquexing?sslmode=disable
      MIGRATIONS_PATH: file:///app/migrations
    entrypoint: ["/usr/local/bin/xqx-migrate", "up"]

  api:
    image: xiaoquexing/xqx-api:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: ${APP_ENV:-staging}
      HTTP_ADDR: :8080
      POSTGRES_DSN: postgres://xqx:${POSTGRES_PASSWORD}@postgres:5432/xiaoquexing?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-xqx:staging:}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY}
      PHONE_HASH_PEPPER: ${PHONE_HASH_PEPPER}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_DEV_CODE: ${SMS_DEV_CODE:-123456}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      MIGRATIONS_PATH: file:///app/migrations
    healthcheck:
      test: ["CMD", "/usr/local/bin/xqx-health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  xqx_pg:
  xqx_redis:
