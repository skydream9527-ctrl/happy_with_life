name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xqx
          POSTGRES_PASSWORD: xqx
          POSTGRES_DB: xiaoquexing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xqx -d xiaoquexing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"
      - name: test
        run: go test ./...
      - name: test-race
        run: go test -race ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
      - name: openapi lint
        run: npx --yes @redocly/cli@1 lint openapi/openapi.yaml
      - name: migrate up/down/up
        env:
          POSTGRES_DSN: postgres://xqx:xqx@127.0.0.1:5432/xiaoquexing?sslmode=disable
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate down
          go run ./cmd/migrate up

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t xiaoquexing/xqx-api:${{ github.sha }} -f deploy/docker/Dockerfile .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
